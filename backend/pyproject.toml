[project]
name = "punkathon-agent"
version = "0.1.0"
description = "PunkAgent: agente DeepAgents per movimenti bancari, budget e coaching finanziario"
readme = "README.md"
authors = [
    { name = "Felipe Operti", email = "operti.felipe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "deepagents>=0.4.12",
    "elevenlabs>=2.42.0",
    "fastapi>=0.135.3",
    "jupyter>=1.1.1",
    "langchain>=1.2.14",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.4",
    "langgraph-cli[inmem]>=0.4.19",
    "notebook>=7.5.5",
    "pydantic>=2.12.5",
    "pyjwt>=2.12.1",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.38",
    "tavily-python>=0.7.23",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
]

[project.scripts]
punkagent = "punkathon_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
